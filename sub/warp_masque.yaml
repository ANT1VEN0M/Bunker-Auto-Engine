# ==============================================================================
# 🛡️ BUNKER VPN — CLOUDFLARE WARP-MASQUE (HTTP/3 CONNECT-IP)
# ==============================================================================
# Совместимо с Mihomo / Clash.Meta / Clash Verge Rev / Flclash
# Протокол: RFC 9484 (CONNECT-IP over HTTP/3 QUIC) через Anycast Cloudflare
# Бронебойная маскировка под веб-трафик к consumer-masque.cloudflareclient.com
# ==============================================================================

port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
unified-delay: true

dns:
  enable: true
  listen: :1053
  ipv6: false
  nameserver:
    - 77.88.8.8
    - 1.1.1.1
  fallback:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query

proxies:
  - name: "⚡ [WARP-MASQUE] Бункер Ультра (HTTP/3) | ⚡40ms"
    type: masque
    server: 162.159.198.1
    port: 443
    private-key: "aFXzG5gP98J108YIjOAtUR1fwIo/+2g8RM67oAEkTWo="
    public-key: "bmXOC+F1FxEMF9dyiK2H5/1SUtzH0JuVo51h2wPfgyo="
    ip: 172.16.0.2/32
    ipv6: 2606:4700:110:8b8c:944:f7b:d00e:de23/128
    mtu: 1280
    udp: true
    sni: consumer-masque.cloudflareclient.com
    network: quic
    remote-dns-resolve: true

proxy-groups:
  - name: "🚀 BUNKER-AUTO"
    type: select
    proxies:
      - "⚡ [WARP-MASQUE] Бункер Ультра (HTTP/3) | ⚡40ms"
      - DIRECT

rules:
  - GEOIP,private,DIRECT
  - GEOIP,RU,DIRECT
  - MATCH,🚀 BUNKER-AUTO
