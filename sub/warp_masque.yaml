# ==============================================================================
# 🛡️ BUNKER VPN — CLOUDFLARE WARP-MASQUE (RFC 9484 CONNECT-IP)
# ==============================================================================
# Совместимо с Mihomo / Clash.Meta / Clash Verge Rev / Flclash
# Протокол: RFC 9484 (CONNECT-IP over HTTP/2 & HTTP/3 QUIC) через Anycast Cloudflare
# Ключи: ECDSA P-256 (secp256r1) сгенерированные по спецификации usque
# Оптимизация: YAML-якоря (&base / <<: *base) для максимальной компактности
# Настройки оптимизированы с учётом рекомендаций Тестировщика Т (Bunker QA Team)
# ==============================================================================

port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
unified-delay: true
tcp-concurrent: true
ipv6: true

dns:
  enable: true
  ipv6: true
  prefer-h3: false
  cache-algorithm: arc
  use-hosts: false
  use-system-hosts: true
  respect-rules: false
  nameserver:
    - https://76.76.2.11/p0
    - https://76.76.10.11/p0

tun:
  enable: true
  device: Mihomo
  stack: mips
  mtu: 9000
  gso: true
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  strict-route: true
  auto-redirect: true
  auto-detect-interface: true
  endpoint-independent-nat: false

# ==============================================================================
# ⚓ БАЗОВЫЕ ШАБЛОНЫ (YAML-ЯКОРЯ ДЛЯ КОМПАКТНОСТИ)
# ==============================================================================
shared_masque: &masque_base
  type: masque
  private-key: "MHcCAQEEIAzK5/8aUYk7Y93Qz7eq2IcS3V3KVR4HfTlOI0v3gJ5hoAoGCCqGSM49AwEHoUQDQgAEf1GRRayn/ZI2cBiUqZuDtEtD7RdJaH9uLrcoLe4UwoxqGorZZ6PM6ZCAMNDQ85yuPFExnnTosii5U0iC8nmdVg=="
  public-key: "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEIaU7MToJm9NKp8YfGxR6r+/h4mcG7SxI8tsW8OR1A5tv/zCzVbCRRh2t87/kxnP6lAy0lkr7qYwu+ox+k3dr6w=="
  ip: 172.16.0.2/32
  ipv6: 2606:4700:110:82ce:a467:aa1:bb60:2ba3/128
  mtu: 1280
  udp: true
  skip-cert-verify: true
  remote-dns-resolve: true

# 162.159.198.1 оптимизирован для QUIC/H3
shared_h3: &masque_h3
  server: 162.159.198.1
  port: 443
  <<: *masque_base
  network: quic

# 162.159.198.2 оптимизирован для TCP/H2
shared_h2: &masque_h2
  server: 162.159.198.2
  port: 443
  <<: *masque_base
  network: h2

# ==============================================================================
# 🚀 СПИСОК ПРОКСИ (ПРОФИЛИ С БЕЛЫМИ SNI)
# ==============================================================================
proxies:
  # HTTP/3 (QUIC UDP) — Самый стабильный и быстрый протокол
  - name: "⚡ [WARP-MASQUE] Бункер H3 (Zero Trust)"
    <<: *masque_h3
    sni: vk.com

  - name: "⚡ [WARP-MASQUE] Бункер H3 (API)"
    <<: *masque_h3
    sni: vk.com

  - name: "⚡ [WARP-MASQUE] Бункер H3 (Consumer)"
    <<: *masque_h3
    sni: vk.com

  - name: "⚡ [WARP-MASQUE] Бункер H3 (Google SNI)"
    <<: *masque_h3
    sni: www.gstatic.com

  - name: "⚡ [WARP-MASQUE] Бункер H3 (Cloudflare SNI)"
    <<: *masque_h3
    sni: cdn.cloudflare.com

  # HTTP/2 (TCP) — Резервный канал
  - name: "⚡ [WARP-MASQUE] Бункер H2 (Zero Trust)"
    <<: *masque_h2
    sni: vk.com

  - name: "⚡ [WARP-MASQUE] Бункер H2 (API)"
    <<: *masque_h2
    sni: vk.com

  - name: "⚡ [WARP-MASQUE] Бункер H2 (Consumer)"
    <<: *masque_h2
    sni: vk.com

# ==============================================================================
# 🎯 ГРУППЫ МАРШРУТИЗАЦИИ (АВТОВЫБОР С МИНИМАЛЬНЫМ ПИНГОМ)
# ==============================================================================
proxy-groups:
  - name: "🚀 BUNKER-AUTO (Автовыбор H2/H3)"
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
      - "⚡ [WARP-MASQUE] Бункер H3 (Zero Trust)"
      - "⚡ [WARP-MASQUE] Бункер H3 (API)"
      - "⚡ [WARP-MASQUE] Бункер H3 (Consumer)"
      - "⚡ [WARP-MASQUE] Бункер H3 (Google SNI)"
      - "⚡ [WARP-MASQUE] Бункер H3 (Cloudflare SNI)"
      - "⚡ [WARP-MASQUE] Бункер H2 (Zero Trust)"
      - "⚡ [WARP-MASQUE] Бункер H2 (API)"
      - "⚡ [WARP-MASQUE] Бункер H2 (Consumer)"

  - name: "🛡️ BUNKER-MASQUE"
    type: select
    proxies:
      - "🚀 BUNKER-AUTO (Автовыбор H2/H3)"
      - "⚡ [WARP-MASQUE] Бункер H3 (Zero Trust)"
      - "⚡ [WARP-MASQUE] Бункер H3 (Google SNI)"
      - "⚡ [WARP-MASQUE] Бункер H3 (Cloudflare SNI)"
      - "⚡ [WARP-MASQUE] Бункер H2 (Zero Trust)"
      - DIRECT
    exclude-type: direct

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
    QUIC:
      ports: [443, 8443]

rules:
  - GEOSITE,private,DIRECT
  - GEOSITE,category-ru,DIRECT
  - GEOIP,LAN,DIRECT,no-resolve
  - GEOIP,RU,DIRECT
  - MATCH,🚀 BUNKER-AUTO (Автовыбор H2/H3)
