name: Bunker Auto-Engine Subscriptions

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-subscriptions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bunker Auto-Engine Pipeline
        run: |
          python -m engine.main

      - name: Commit and Push Changes
        run: |
          git config --local user.email "bot@bunker-engine.local"
          git config --local user.name "Bunker Auto-Engine Bot 🐈‍⬛"
          git add sub/ README.md
          if git diff --staged --quiet; then
            echo "No subscription updates found. Skipping commit."
          else
            git commit -m "🚀 Auto-update Bunker subscriptions [$(date -u +'%Y-%m-%d %H:%M:%S UTC')] [skip ci]"
            git push origin main
          fi

      - name: Purge jsDelivr CDN Cache
        if: always()
        run: |
          python -c "
          import urllib.request
          files = ['mix_b64.txt', 'mix.txt', 'bs_b64.txt', 'bs.txt', 'fast_b64.txt', 'fast.txt', 'tg_b64.txt', 'tg.txt', 'factory_b64.txt', 'factory.txt', 'warp_pool.json', 'warp.txt', 'warp_b64.txt']
          for f in files:
              try:
                  urllib.request.urlopen(f'https://purge.jsdelivr.net/gh/ANT1VEN0M/Bunker-Auto-Engine@latest/sub/{f}', timeout=10)
                  print(f'Purged {f}')
              except Exception as e:
                  print(f'Error purging {f}: {e}')
          "
