name: Bunker Auto-Engine Subscriptions

on:
  schedule:
    # Runs every hour at minute 0 (00:00, 01:00, 02:00, ... UTC)
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-subscriptions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bunker Auto-Engine Pipeline
        run: |
          python -m engine.main

      - name: Commit and Push Changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "bot@bunker-engine.local"
          git config --local user.name "Bunker Auto-Engine Bot 🐈‍⬛"
          git add sub/ README.md
          if git diff --staged --quiet; then
            echo "No subscription updates found. Skipping commit."
          else
            TIMESTAMP=$(date -u +'%Y%m%d%H%M')
            TAG="v1.1.${TIMESTAMP}"
            git commit -m "🚀 Auto-update Bunker subscriptions [$(date -u +'%Y-%m-%d %H:%M:%S UTC')] [skip ci]"
            git tag "$TAG"
            git push origin main --tags
            gh release create "$TAG" --title "Bunker Subscriptions $TAG" --notes "Automated anti-censorship update" || echo "Release creation skipped"
          fi

      - name: Purge jsDelivr CDN Cache
        if: always()
        run: |
          python -c "
          import urllib.request
          # Invalidate repo-level resolution first
          try:
              urllib.request.urlopen('https://purge.jsdelivr.net/gh/ANT1VEN0M/Bunker-Auto-Engine', timeout=10)
              urllib.request.urlopen('https://purge.jsdelivr.net/gh/ANT1VEN0M/Bunker-Auto-Engine@latest', timeout=10)
          except Exception as e:
              print(f'Repo purge notice: {e}')

          files = ['mix_b64.txt', 'mix.txt', 'discord_b64.txt', 'discord.txt', 'bs_b64.txt', 'bs.txt', 'fast_b64.txt', 'fast.txt', 'tg_b64.txt', 'tg.txt', 'factory_b64.txt', 'factory.txt', 'warp_pool.json', 'warp.txt', 'warp_b64.txt']
          for f in files:
              for v in ['latest', 'main']:
                  try:
                      urllib.request.urlopen(f'https://purge.jsdelivr.net/gh/ANT1VEN0M/Bunker-Auto-Engine@{v}/sub/{f}', timeout=10)
                      print(f'Purged {v}/{f}')
                  except Exception as e:
                      print(f'Error purging {v}/{f}: {e}')
          "
